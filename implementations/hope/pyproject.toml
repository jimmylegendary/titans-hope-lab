[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-learning-hope"
version = "1.0.0"
description = "HOPE: Nested Learning in PyTorch (arXiv:2512.24695) — attention-free language model with self-modifying Titans and a Continuum Memory System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "nested-learning", "hope", "titans", "test-time-learning",
    "test-time-training", "continual-learning", "language-model",
    "attention-free", "delta-rule", "fast-weights", "long-context",
    "paper-implementation",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.9.1,<2.10", "numpy>=2.0,<3"]

[project.scripts]
hope-tiny = "hope.cli:main"

[project.optional-dependencies]
train = ["pyarrow", "huggingface_hub"]
bpe = ["accelerate", "transformers", "pyarrow"]
figures = ["matplotlib"]
dev = ["pytest"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
packages = ["hope"]
